<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="0.55" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="25%" cy="25%" r="65%">
      <stop offset="0" stop-color="rgba(242,213,138,0.45)"/>
      <stop offset="1" stop-color="rgba(242,213,138,0)"/>
    </radialGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2416"/>
      <stop offset="0.55" stop-color="#2a160d"/>
      <stop offset="1" stop-color="#190f0a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d58a"/>
      <stop offset="1" stop-color="#d9b35f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1400" height="900" rx="42" fill="url(#bg)"/>
  <rect width="1400" height="900" rx="42" fill="url(#goldGlow)"/>

  <!-- condensation highlights -->
  <g opacity="0.18" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2">
    <path d="M1040 210c-40 70-30 120 10 170" />
    <path d="M1110 250c-30 55-22 95 8 135" />
    <path d="M980 260c-22 45-18 80 6 115" />
  </g>

  <!-- glass -->
  <g>
    <path d="M920 210h260l-40 520c-3 38-34 70-72 70H1032c-38 0-69-32-72-70l-40-520Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <path d="M952 255h196l-30 430c-2 28-25 52-54 52h-28c-29 0-52-24-54-52l-30-430Z" fill="url(#coffee)" opacity="0.92"/>
    <path d="M960 310c55-40 150-40 200 0" fill="none" stroke="rgba(242,213,138,0.55)" stroke-width="6" stroke-linecap="round"/>
    <path d="M980 270c30-40 70-55 110-55 45 0 80 20 105 58" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="10" stroke-linecap="round"/>
    <path d="M960 345c70-35 160-30 205 8" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="10" stroke-linecap="round"/>
    <!-- cream swirl -->
    <path d="M990 292c30-24 70-30 100-18 18 7 30 18 38 33 6 12 6 26-6 38-12 12-35 18-56 14-22-4-43-20-48-37-4-12 0-23 10-30Z"
          fill="url(#cream)" opacity="0.9" filter="url(#soft)"/>
    <!-- straw -->
    <path d="M1120 175l-30 40 40 25-200 305" stroke="rgba(242,213,138,0.85)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- label -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="90" y="160" font-size="56" fill="rgba(243,241,236,0.94)" letter-spacing="0.8">Cold Coffee</text>
    <text x="90" y="210" font-size="18" fill="rgba(243,241,236,0.68)" letter-spacing="4">PREMIUM • CHILLED • CRAFTED</text>
    <text x="90" y="270" font-size="16" fill="rgba(243,241,236,0.70)" style="font-family: ui-sans-serif, system-ui;">Smooth, rich, and balanced — made for a premium finish.</text>
  </g>
</svg>

